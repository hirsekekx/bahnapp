[project]
name = "bahnapp"
version = "0.1.0"
description = "Bahn-Ausfall-Tracker: Beobachtet ICE/IC-Verbindungen und berechnet Ausfall-Wahrscheinlichkeiten"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "lxml>=5.2",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "apscheduler>=3.10",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "streamlit>=1.36",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "pandas>=2.2",
    "plotly>=5.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
